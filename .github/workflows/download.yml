name: Download APK

on:
  workflow_dispatch:
    inputs:
      apk_url:
        description: 'Link of APK file'
        required: true
        type: string

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Download APK
        run: |
          curl -L -o app.apk "${{ github.event.inputs.apk_url }}"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: downloaded-apk
          path: app.apk
