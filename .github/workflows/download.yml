name: Download APK

on:
  workflow_dispatch:
    inputs:
      apk_url:
        description: 'لینک مستقیم فایل APK'
        required: true
        type: string

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Download APK
        run: |
          curl -L -o app.apk \
            -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" \
            "${{ github.event.inputs.apk_url }}"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: downloaded-apk
          path: app.apk
